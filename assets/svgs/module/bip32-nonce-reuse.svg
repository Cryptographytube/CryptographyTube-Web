<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g transform="translate(0 8)">
<!-- master node (root, with crown key) -->
<g transform="translate(256 96)">
  <rect x="-70" y="-40" width="140" height="80" rx="16" fill="#EDE1FB" stroke="#6D28D9" stroke-width="8"/>
  <circle cx="-34" cy="0" r="18" fill="none" stroke="#6D28D9" stroke-width="9"/>
  <rect x="-18" y="-6" width="70" height="12" rx="4" fill="#6D28D9"/>
  <rect x="44" y="6" width="10" height="16" rx="3" fill="#6D28D9"/>
  <text x="8" y="-50" font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#6D28D9" text-anchor="middle">xpub</text>
</g>
<!-- tree edges to two children -->
<path d="M220 156 L150 232 M292 156 L362 232" fill="none" stroke="#556080" stroke-width="8" stroke-linecap="round"/>
<text x="176" y="206" font-family="monospace" font-weight="700" font-size="26" fill="#556080">/0</text>
<text x="316" y="206" font-family="monospace" font-weight="700" font-size="26" fill="#556080">/1</text>
<!-- child 0 -->
<g transform="translate(150 272)">
  <rect x="-58" y="-38" width="116" height="76" rx="14" fill="#D0E8FF" stroke="#1C71DA" stroke-width="7"/>
  <text x="0" y="10" font-family="monospace" font-weight="800" font-size="34" fill="#1C71DA" text-anchor="middle">d&#8321;</text>
</g>
<!-- child 1 -->
<g transform="translate(362 272)">
  <rect x="-58" y="-38" width="116" height="76" rx="14" fill="#D0E8FF" stroke="#1C71DA" stroke-width="7"/>
  <text x="0" y="10" font-family="monospace" font-weight="800" font-size="34" fill="#1C71DA" text-anchor="middle">d&#8322;</text>
</g>
<!-- shared nonce k link between the two children (the vulnerability) -->
<path d="M208 320 C240 380 272 380 304 320" fill="none" stroke="#E74C3C" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 16"/>
<g transform="translate(256 372)">
  <circle r="30" fill="#FFE0DE" stroke="#C0392B" stroke-width="8"/>
  <text x="0" y="12" font-family="monospace" font-weight="800" font-size="36" fill="#C0392B" text-anchor="middle">k</text>
</g>
<text x="256" y="446" font-family="monospace" font-weight="800" font-size="30" fill="#C0392B" text-anchor="middle">same nonce</text>
</g></svg>
