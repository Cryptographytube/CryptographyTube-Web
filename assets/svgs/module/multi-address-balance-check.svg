<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Multi Address Balance Check: a list of Bitcoin addresses, each verified, each with a balance -->
  <!-- list panel -->
  <rect x="68" y="92" width="376" height="328" rx="26" fill="#EAF7F0" stroke="#16A34A" stroke-width="8"/>
  <!-- row 1 -->
  <g>
    <circle cx="120" cy="170" r="24" fill="#16A34A"/>
    <path d="M109 170 l8 9 l15 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="157" width="176" height="26" rx="13" fill="#8AA0B8"/>
    <circle cx="392" cy="170" r="30" fill="#f7931a"/>
    <text x="392" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#ffffff">&#8383;</text>
  </g>
  <!-- row 2 -->
  <g>
    <circle cx="120" cy="256" r="24" fill="#16A34A"/>
    <path d="M109 256 l8 9 l15 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="243" width="140" height="26" rx="13" fill="#8AA0B8"/>
    <circle cx="392" cy="256" r="30" fill="#f7931a"/>
    <text x="392" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#ffffff">&#8383;</text>
  </g>
  <!-- row 3 -->
  <g>
    <circle cx="120" cy="342" r="24" fill="#16A34A"/>
    <path d="M109 342 l8 9 l15 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="329" width="164" height="26" rx="13" fill="#8AA0B8"/>
    <circle cx="392" cy="342" r="30" fill="#f7931a"/>
    <text x="392" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#ffffff">&#8383;</text>
  </g>
