<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g transform="translate(-7.39 -28.01) scale(1.0309)">
<!-- puzzle piece (interlocking square tabs) -->
<rect x="150" y="78" width="212" height="188" rx="24" fill="#D0E8FF" stroke="#1C71DA" stroke-width="9"/>
<rect x="214" y="52" width="84" height="36" rx="12" fill="#1C71DA"/>
<rect x="214" y="238" width="84" height="30" rx="12" fill="#1C71DA"/>
<!-- puzzle number badge -->
