  <rect x="-62" y="-40" width="124" height="80" rx="18" fill="#FFFFFF" stroke="#1C71DA" stroke-width="7"/>
  <text x="0" y="6" font-family="Arial, sans-serif" font-weight="800" font-size="44" fill="#1C71DA" text-anchor="middle">2<text font-size="26">n</text></text>
</g>
<!-- key range bar: 0 → max -->
<rect x="96" y="330" width="320" height="18" rx="9" fill="#556080" opacity=".4"/>
<rect x="96" y="330" width="150" height="18" rx="9" fill="#D09838"/>
<rect x="246" y="320" width="20" height="38" rx="5" fill="#FF5D5D"/>
