  <circle cx="256" cy="180" r="100" fill="none" stroke="#D09838" stroke-width="6" opacity=".55"/>
  <!-- drawn Bitcoin symbol (font-independent) -->
  <text x="256" y="236" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="150" fill="#7a4f08" text-anchor="middle">B</text>
  <g fill="#7a4f08">
    <rect x="232" y="112" width="11" height="140" rx="4"/>
    <rect x="258" y="112" width="11" height="140" rx="4"/>
  </g>
  <!-- SHA-256 typo-check validated badge -->
  <circle cx="352" cy="98" r="40" fill="#2E7D32" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M336 98 l12 13 22 -27" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- short mini-key label chip -->
  <rect x="86" y="356" width="340" height="92" rx="20" fill="#D0E8FF" stroke="#1C71DA" stroke-width="8"/>
  <text x="256" y="416" font-family="monospace" font-weight="700" font-size="44" fill="#1C71DA" text-anchor="middle">S6c56b&#8230;</text>
