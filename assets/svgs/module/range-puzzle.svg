  <text x="96" y="390">0</text>
  <text x="374" y="390">2&#8319;</text>
</g>
<!-- the gold key hiding in the range -->
<g transform="translate(256 440)">
  <rect x="-22" y="-14" width="44" height="34" rx="9" fill="#F0C419"/>
  <rect x="-8" y="-6" width="16" height="16" rx="4" fill="#363E51"/>
  <rect x="-6" y="20" width="12" height="30" rx="3" fill="#F0C419"/>
  <rect x="6" y="40" width="22" height="9" rx="3" fill="#D09838"/>
  <rect x="6" y="53" width="15" height="7" rx="3" fill="#D09838"/>
</g>
</g></svg>