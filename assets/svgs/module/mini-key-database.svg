<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- ===== Database cylinder = the stored key/address space ===== -->
  <!-- body -->
  <path d="M55 175 V340 A110 40 0 0 0 275 340 V175 Z" fill="#3b82f6"/>
  <!-- darker front shading bands -->
  <path d="M55 245 A110 40 0 0 0 275 245" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
  <path d="M55 300 A110 40 0 0 0 275 300" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
  <!-- top lid -->
  <ellipse cx="165" cy="175" rx="110" ry="40" fill="#60a5fa"/>
  <!-- stored-row ticks on the lid -->
  <g fill="#1e40af" opacity="0.65">
    <rect x="108" y="169" width="70" height="11" rx="5.5"/>
    <rect x="190" y="169" width="34" height="11" rx="5.5"/>
  </g>

  <!-- ===== Mini key = the compact "mini key" ===== -->
  <g stroke="#f59e0b" stroke-width="26" stroke-linecap="round" fill="none">
    <!-- bow (ring) -->
    <circle cx="360" cy="210" r="40"/>
    <!-- shaft -->
    <line x1="388" y1="238" x2="470" y2="320"/>
    <!-- teeth -->
    <line x1="448" y1="298" x2="430" y2="316"/>
    <line x1="470" y1="320" x2="452" y2="338"/>
  </g>
</svg>
